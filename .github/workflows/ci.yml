name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18.4"
  OTP_VERSION: "27.3.4"
  MIX_ENV: test

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Get dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Check unused dependencies
        run: mix deps.unlock --unused --check-unused
      - uses: actions/upload-artifact@v4
        with:
          name: charger-build
          include-hidden-files: true
          path: |
            deps
            _build

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - uses: actions/download-artifact@v4
        with:
          name: charger-build
      - name: Check formatting
        run: mix format --check-formatted

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force
      - uses: actions/download-artifact@v4
        with:
          name: charger-build
      - name: Run tests
        run: mix test
